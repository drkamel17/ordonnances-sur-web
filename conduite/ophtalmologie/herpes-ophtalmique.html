<!DOCTYPE html>

<head><meta charset="UTF-8"><title>Herpès ophtalmique - Ophtalmologie</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Segoe UI",sans-serif;background-color:#f5f5f5;padding:20px}.container{background:white;border-radius:15px;width:100%;max-width:800px;margin:0 auto}.header{background:linear-gradient(135deg,#9b59b6,#8e44ad);color:white;padding:30px;text-align:center}.header h1{font-size:2em}.content{padding:30px}.section{margin-bottom:25px}.section-title{color:#9b59b6;font-size:1.3em;margin-bottom:15px;border-bottom:2px solid #9b59b6}.clinical-box,.treatment-box{background:#f9f9f9;border-radius:10px;padding:20px}.clinical-box{border-left:4px solid #e74c3c}.treatment-box{border-left:4px solid #27ae60}.back-button{display:inline-block;background:#9b59b6;color:white;padding:12px 25px;border-radius:25px;text-decoration:none;margin-top:20px}.highlight-search{background-color:#fff3cd;padding:0 2px;border-radius:2px}</style>
</head>
<body><div class="container"><div class="header"><h1>Herpès ophtalmique</h1><div class="subtitle">Ophtalmologie - Dr. KHERBA N</div></div><div class="content"><div class="section"><h2 class="section-title">Signes infectieux</h2><div class="clinical-box"><ul><li>Rougeur</li><li>Douleur</li></ul></div></div><div class="section"><h2 class="section-title">Traitement</h2><div class="treatment-box"><ul><li><strong>Aciclosina pmd</strong> - 1app 3/j pdt 10j</li></ul></div></div><a href="index.html" class="back-button"> Retour à l'index</a></div></div><script>
(function(){const params=new URLSearchParams(window.location.search);const highlight=params.get('highlight');if(highlight){const body=document.body;const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);let node;const regex=new RegExp('('+highlight.replace(/[.*+?^$()|[\]\\\/g,'\</body>')+')','gi');const nodesToReplace=[];while(node=walker.nextNode()){if(node.parentElement.tagName==='MARK')continue;if(node.parentElement.tagName==='A')continue;if(node.parentElement.tagName==='SCRIPT')continue;const text=node.textContent;if(regex.test(text)){nodesToReplace.push({node:node,text:text});}}nodesToReplace.forEach(item=>{const text=item.text;const parent=item.node.parentNode;const wrapper=document.createElement('span');wrapper.innerHTML=text.replace(regex,'<mark class="highlight-search"></mark>');while(wrapper.firstChild){parent.insertBefore(wrapper.firstChild,item.node);}parent.removeChild(item.node);});}})();
</script></body>
