<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tremblement - Conduite a Tenir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #34495e; --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); --card-bg: #ffffff; --text-main: #2c3e50; --text-muted: #7f8c8d; }
        body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg-gradient); margin: 0; padding: 20px; color: var(--text-main); }
        .container { background-color: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); padding: 30px; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); border-bottom: 3px solid var(--primary-color); padding-bottom: 15px; }
        h2 { color: #2980b9; margin-top: 25px; border-left: 4px solid #2980b9; padding-left: 10px; }
        .back-link { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 25px; font-weight: 600; }
        .back-link:hover { background-color: #2980b9; }
        ul { line-height: 1.8; }
        li { margin-bottom: 8px; }
        .highlight-search { background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour a la liste</a>
        
        <h1><i class="fas fa-peace"></i> Tremblement</h1>
        
        <h2>Clinique</h2>
        <p>Mouvements anormaux involontaires, rythmiques et oscillatoires, de faible amplitude..</p>
        <p>Examen neurologique</p>
        
        <h2>Bilan</h2>
        <ul>
            <li>FNS</li>
            <li>Gly a jeun</li>
            <li>TSH/T4</li>
            <li>Vit D3</li>
            <li>Vit B12</li>
            <li>Ca / Mg</li>
            <li>PTH</li>
        </ul>
    </div>
</body>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const highlight = params.get('highlight');
    if (highlight) {
        const body = document.body;
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
        let node;
        const regex = new RegExp('(' + highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const nodesToReplace = [];
        while (node = walker.nextNode()) {
            if (node.parentElement.tagName === 'MARK') continue;
            if (node.parentElement.tagName === 'A') continue;
            if (node.parentElement.tagName === 'SCRIPT') continue;
            const text = node.textContent;
            if (regex.test(text)) {
                nodesToReplace.push({node: node, text: text});
            }
        }
        nodesToReplace.forEach(item => {
            const text = item.text;
            const parent = item.node.parentNode;
            const wrapper = document.createElement('span');
            wrapper.innerHTML = text.replace(regex, '<mark class="highlight-search">$1</mark>');
            while (wrapper.firstChild) {
                parent.insertBefore(wrapper.firstChild, item.node);
            }
            parent.removeChild(item.node);
        });
    }
})();
</script>
</html>
