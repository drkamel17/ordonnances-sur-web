<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurologie - Conduite a Tenir</title>
    <meta name="description" content="Conduites a tenir en Neurologie">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #34495e; --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); --card-bg: #ffffff; --text-main: #2c3e50; --text-muted: #7f8c8d; }
        body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg-gradient); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-main); }
        .container { background-color: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); padding: 30px; max-width: 700px; width: 100%; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; }
        .back-link { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 25px; font-weight: 600; }
        .back-link:hover { background-color: #2980b9; }
        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .cta-button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%); border: 2px solid #e0e0e0; border-radius: 10px; text-decoration: none; color: var(--text-main); font-weight: 600; transition: all 0.3s ease; text-align: center; font-size: 0.95em; }
        .cta-button:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52, 73, 94, 0.2); }
        .cta-button i { font-size: 1.3em; color: var(--primary-color); }
        
        .search-section { margin-bottom: 25px; padding: 20px; background: #f8f9fa; border-radius: 12px; border: 2px solid #e0e0e0; }
        .search-input-wrapper { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        .search-input:focus { border-color: var(--primary-color); outline: none; }
        .search-btn { padding: 12px 20px; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .search-btn:hover { background: #2c3e50; }
        
        .search-options { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; }
        .search-options input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        
        .search-results { margin-top: 15px; }
        .result-item { padding: 12px; background: white; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary-color); }
        .result-item a { color: var(--primary-color); font-weight: 600; text-decoration: none; font-size: 1.1em; display: block; margin-bottom: 5px; }
        .result-item a:hover { text-decoration: underline; }
        .result-item .result-excerpt { color: var(--text-muted); font-size: 0.9em; line-height: 1.5; }
        .result-item .result-excerpt mark { background: #fff3cd; padding: 0 2px; border-radius: 2px; }
        .no-results { padding: 15px; text-align: center; color: var(--text-muted); background: #fff3cd; border-radius: 8px; }
        .hidden { display: none !important; }
        
        @media (max-width: 600px) {
            .search-input-wrapper { flex-direction: column; }
            .search-options { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour aux specialites</a>
        
        <h1><i class="fas fa-brain"></i> Neurologie</h1>
        <p class="subtitle">18 conduites a tenir</p>
        
        <div class="search-section">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher dans les fichiers...">
                <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i> Rechercher</button>
            </div>
            
            <div class="search-options">
                <label>
                    <input type="radio" name="searchType" value="titles" checked>
                    <i class="fas fa-heading"></i> Titres seulement
                </label>
                <label>
                    <input type="radio" name="searchType" value="content">
                    <i class="fas fa-file-alt"></i> Contenu complet
                </label>
            </div>
            
            <div id="searchResults" class="search-results"></div>
        </div>
        
        <div class="buttons-grid" id="buttonsGrid">
            <a href="attaque-panique.html" class="cta-button"><i class="fas fa-panic-b"></i> Attaque de panique</a>
            <a href="avc.html" class="cta-button"><i class="fas fa-user-injured"></i> AVC</a>
            <a href="coma.html" class="cta-button"><i class="fas fa-bed"></i> Coma</a>
            <a href="convulsion.html" class="cta-button"><i class="fas fa-bolt"></i> Convulsion</a>
            <a href="epilepsie.html" class="cta-button"><i class="fas fa-brain"></i> Crise epilepsie</a>
            <a href="migraine.html" class="cta-button"><i class="fas fa-head-side"></i> Crise Migraine</a>
            <a href="dnv.html" class="cta-button"><i class="fas fa-heart-pulse"></i> DNV</a>
            <a href="fourmillements.html" class="cta-button"><i class="fas fa-hand-sparkles"></i> Fourmillements</a>
            <a href="hernie-discale.html" class="cta-button"><i class="fas fa-bone"></i> Hernie discale</a>
            <a href="hic.html" class="cta-button"><i class="fas fa-skull"></i> HIC</a>
            <a href="meningite.html" class="cta-button"><i class="fas fa-virus"></i> Meningite</a>
            <a href="neuropathie-diabetique.html" class="cta-button"><i class="fas fa-ribbon"></i> Neuropathie diabetique</a>
            <a href="nevralgie.html" class="cta-button"><i class="fas fa-bolt"></i> Nevralgie</a>
            <a href="paralysie-faciale.html" class="cta-button"><i class="fas fa-face-tired"></i> Paralysie faciale</a>
            <a href="paresthesie.html" class="cta-button"><i class="fas fa-hand"></i> Paresthesie</a>
            <a href="tremblement.html" class="cta-button"><i class="fas fa-peace"></i> Tremblement</a>
            <a href="vertiges-aigus.html" class="cta-button"><i class="fas fa-dizzy"></i> Vertiges aigus</a>
        </div>
    </div>
    
    <script>
        const filesList = [
            'attaque-panique.html', 'avc.html', 'coma.html', 'convulsion.html', 'epilepsie.html',
            'migraine.html', 'dnv.html', 'fourmillements.html', 'hernie-discale.html', 'hic.html',
            'meningite.html', 'neuropathie-diabetique.html', 'nevralgie.html', 'paralysie-faciale.html',
            'paresthesie.html', 'tremblement.html', 'vertiges-aigus.html'
        ];
        
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResults = document.getElementById('searchResults');
        const buttonsGrid = document.getElementById('buttonsGrid');
        const radioButtons = document.getElementsByName('searchType');
        
        async function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                searchResults.innerHTML = '';
                buttonsGrid.classList.remove('hidden');
                return;
            }
            
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            
            if (searchType === 'titles') {
                searchInTitles(query);
            } else {
                await searchInContent(query);
            }
        }
        
        function searchInTitles(query) {
            const buttons = buttonsGrid.querySelectorAll('.cta-button');
            let found = false;
            
            buttons.forEach(btn => {
                const text = btn.textContent.toLowerCase();
                const href = btn.getAttribute('href');
                if (text.includes(query) || href.toLowerCase().includes(query)) {
                    btn.classList.remove('hidden');
                    found = true;
                } else {
                    btn.classList.add('hidden');
                }
            });
            
            if (!found) {
                searchResults.innerHTML = '<div class="no-results"><i class="fas fa-search"></i> Aucun resultat trouve pour "' + query + '"</div>';
            } else {
                searchResults.innerHTML = '';
            }
        }
        
        async function searchInContent(query) {
            searchResults.innerHTML = '<div class="no-results"><i class="fas fa-spinner fa-spin"></i> Recherche en cours...</div>';
            buttonsGrid.classList.add('hidden');
            
            const results = [];
            
            for (const file of filesList) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    
                    const text = await response.text();
                    
                    const titleMatch = text.match(/<title>([^<]+)<\/title>/);
                    const title = titleMatch ? titleMatch[1] : file.replace('.html', '');
                    
                    const contentLower = text.toLowerCase();
                    if (contentLower.includes(query)) {
                        const index = contentLower.indexOf(query);
                        const start = Math.max(0, index - 50);
                        const end = Math.min(text.length, index + query.length + 50);
                        let excerpt = text.substring(start, end);
                        
                        excerpt = excerpt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                        
                        const regex = new RegExp('(' + query + ')', 'gi');
                        excerpt = excerpt.replace(regex, '<mark>$1</mark>');
                        
                        results.push({
                            file: file,
                            title: title,
                            excerpt: '...' + excerpt + '...',
                            query: query
                        });
                    }
                } catch (e) {
                    console.error('Erreur lecture', file, e);
                }
            }
            
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="no-results"><i class="fas fa-exclamation-triangle"></i> Mot "<strong>' + query + '</strong>" non trouve dans le contenu.</div>';
            } else {
                let html = '';
                results.forEach(r => {
                    const link = r.file + '?highlight=' + encodeURIComponent(r.query);
                    html += `
                        <div class="result-item">
                            <a href="${link}" target="_blank">${r.title}</a>
                            <div class="result-excerpt">${r.excerpt}</div>
                        </div>
                    `;
                });
                searchResults.innerHTML = '<div style="margin-bottom:10px;color:#7f8c8d;">' + results.length + ' resultat(s) trouve(s)</div>' + html;
            }
        }
        
        searchBtn.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        
        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                if (searchInput.value.trim()) {
                    performSearch();
                }
            });
        });
    </script>
</body>
</html>
