<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secheresse buccale - Medecine Interne</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.header { background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%); color: white; padding: 35px 30px; text-align: center; }
.header h1 { font-size: 2.2em; }
.content { padding: 35px 30px; }
.section { margin-bottom: 30px; padding: 25px; border-radius: 12px; background: #f8f9fa; border-left: 5px solid #16a085; }
.section-title { color: #16a085; font-size: 1.5em; margin-bottom: 20px; font-weight: 600; }
.info-item { margin-bottom: 15px; line-height: 1.7; }
ul.info-list { list-style: none; padding: 0; }
ul.info-list li { padding: 12px 15px; margin-bottom: 10px; background: white; border-radius: 8px; border-left: 4px solid #16a085; }
.back-btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #16a085; color: white; text-decoration: none; border-radius: 8px; }
.highlight-search { background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>Secheresse buccale (Xerostomie)</h1></div>
<div class="content">
<div class="section"><h3 class="section-title">Causes</h3><ul class="info-list"><li>Maladie de systeme</li><li>Syndrome sec Gougerot-Sjogren secondaire: <em>Polyarthrite rhumatoid</em> ou <em>LES</em></li><li>Medicaments: Atropine, Antidepresseurs, Radiotherapie</li></ul></div>
<div class="section"><h3 class="section-title">Bilan</h3><p class="info-item">Immunologique</p></div>
<div class="section"><h3 class="section-title">Traitement</h3><ul class="info-list"><li>Sulfarem 25mg</li></ul></div>
<a href="index.html" class="back-btn">Retour</a>
</div></div>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const highlight = params.get('highlight');
    if (highlight) {
        const body = document.body;
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
        let node;
        const regex = new RegExp('(' + highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const nodesToReplace = [];
        while (node = walker.nextNode()) {
            if (node.parentElement.tagName === 'MARK') continue;
            if (node.parentElement.tagName === 'A') continue;
            if (node.parentElement.tagName === 'SCRIPT') continue;
            const text = node.textContent;
            if (regex.test(text)) {
                nodesToReplace.push({node: node, text: text});
            }
        }
        nodesToReplace.forEach(item => {
            const text = item.text;
            const parent = item.node.parentNode;
            const wrapper = document.createElement('span');
            wrapper.innerHTML = text.replace(regex, '<mark class="highlight-search">$1</mark>');
            while (wrapper.firstChild) {
                parent.insertBefore(wrapper.firstChild, item.node);
            }
            parent.removeChild(item.node);
        });
    }
})();
</script>
</body>
</html>
