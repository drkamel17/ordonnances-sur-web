<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medecine Interne - Dr KHERBA N</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%); color: white; padding: 40px 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header h2 { font-size: 1.3em; font-weight: 400; opacity: 0.95; }
        .content { padding: 40px 30px; }
        .section-title { color: #16a085; font-size: 1.8em; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 3px solid #16a085; }
        
        .search-section { margin-bottom: 25px; padding: 20px; background: #f8f9fa; border-radius: 12px; border: 2px solid #16a085; }
        .search-input-wrapper { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        .search-input:focus { border-color: #16a085; outline: none; }
        .search-btn { padding: 12px 20px; background: #16a085; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .search-btn:hover { background: #1abc9c; }
        .search-options { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; color: #555; }
        .search-options input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        .search-results { margin-top: 15px; }
        .result-item { padding: 12px; background: white; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #16a085; }
        .result-item a { color: #16a085; font-weight: 600; text-decoration: none; font-size: 1.1em; display: block; margin-bottom: 5px; }
        .result-item a:hover { text-decoration: underline; }
        .result-item .result-excerpt { color: #666; font-size: 0.9em; line-height: 1.5; }
        .result-item .result-excerpt mark { background: #fff3cd; padding: 0 2px; border-radius: 2px; }
        .no-results { padding: 15px; text-align: center; color: #666; background: #fff3cd; border-radius: 8px; }
        .hidden { display: none !important; }
        
        .condition-list { display: flex; flex-direction: column; gap: 15px; }
        .condition-btn { display: block; width: 100%; padding: 20px 25px; background: white; border: 3px solid #16a085; color: #16a085; font-size: 1.3em; font-weight: 600; text-decoration: none; border-radius: 12px; transition: all 0.3s ease; text-align: left; }
        .condition-btn:hover { background: #16a085; color: white; transform: translateX(10px); box-shadow: 0 5px 20px rgba(22, 160, 133, 0.4); }
        .back-btn { display: inline-block; margin-top: 30px; padding: 12px 25px; background: #333; color: white; text-decoration: none; border-radius: 8px; transition: all 0.3s ease; }
        .back-btn:hover { background: #555; transform: translateY(-2px); }
        @media (max-width: 600px) { .header h1 { font-size: 1.8em; } .content { padding: 25px 20px; } .condition-btn { font-size: 1.1em; padding: 15px 20px; } .search-input-wrapper { flex-direction: column; } .search-options { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Medecine Interne</h1>
            <h2>Dr KHERBA N</h2>
        </div>
        <div class="content">
            <h3 class="section-title">Conditions</h3>
            
            <div class="search-section">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="Rechercher...">
                    <button class="search-btn" id="searchBtn">Rechercher</button>
                </div>
                <div class="search-options">
                    <label><input type="radio" name="searchType" value="titles" checked> Titres seulement</label>
                    <label><input type="radio" name="searchType" value="content"> Contenu complet</label>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
            
            <div class="condition-list" id="buttonsGrid">
                <a href="behcet.html" class="condition-btn">Maladie de Behcet</a>
                <a href="cellulite.html" class="condition-btn">Cellulite</a>
                <a href="engelures.html" class="condition-btn">Engelures</a>
                <a href="erysipele.html" class="condition-btn">Erysipele</a>
                <a href="pied-diabetique.html" class="condition-btn">Pied diabetique</a>
                <a href="purpura-rhumatoide.html" class="condition-btn">Purpura rhumatoide</a>
                <a href="secheresse-buccale.html" class="condition-btn">Secheresse buccale</a>
            </div>
        </div>
    </div>
    
    <script>
        const filesList = ['behcet.html', 'cellulite.html', 'engelures.html', 'erysipele.html', 'pied-diabetique.html', 'purpura-rhumatoide.html', 'secheresse-buccale.html'];
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResults = document.getElementById('searchResults');
        const buttonsGrid = document.getElementById('buttonsGrid');
        
        async function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) { searchResults.innerHTML = ''; buttonsGrid.classList.remove('hidden'); return; }
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            if (searchType === 'titles') { searchInTitles(query); } else { await searchInContent(query); }
        }
        
        function searchInTitles(query) {
            const buttons = buttonsGrid.querySelectorAll('.condition-btn');
            let found = false;
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(query) || btn.getAttribute('href').toLowerCase().includes(query)) {
                    btn.classList.remove('hidden'); found = true;
                } else { btn.classList.add('hidden'); }
            });
            searchResults.innerHTML = found ? '' : '<div class="no-results">Aucun resultat pour "' + query + '"</div>';
        }
        
        async function searchInContent(query) {
            searchResults.innerHTML = '<div class="no-results">Recherche en cours...</div>';
            buttonsGrid.classList.add('hidden');
            const results = [];
            for (const file of filesList) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    const text = await response.text();
                    const titleMatch = text.match(/<title>([^<]+)<\/title>/);
                    const title = titleMatch ? titleMatch[1] : file.replace('.html', '');
                    if (text.toLowerCase().includes(query)) {
                        const index = text.toLowerCase().indexOf(query);
                        let excerpt = text.substring(Math.max(0, index - 50), Math.min(text.length, index + query.length + 50));
                        excerpt = excerpt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                        excerpt = excerpt.replace(new RegExp('(' + query + ')', 'gi'), '<mark>$1</mark>');
                        results.push({ file, title, excerpt });
                    }
                } catch (e) {}
            }
            if (results.length === 0) { searchResults.innerHTML = '<div class="no-results">Mot "' + query + '" non trouve.</div>'; }
            else {
                let html = '';
                results.forEach(r => { html += '<div class="result-item"><a href="' + r.file + '?highlight=' + encodeURIComponent(query) + '">' + r.title + '</a><div class="result-excerpt">...' + r.excerpt + '...</div></div>'; });
                searchResults.innerHTML + html;
            }
        }
        
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        document.querySelectorAll('input[name="searchType"]').forEach(r => r.addEventListener('change', () => { if (searchInput.value.trim()) performSearch(); }));
    </script>
</body>
</html>
