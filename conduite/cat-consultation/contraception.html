<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>CONTRACEPTION - CAT</title><style>body{font-family:"Segoe UI";background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}.container{max-width:900px;margin:0 auto}.header{background:#8e44ad;color:white;padding:25px;border-radius:15px;margin-bottom:25px}.content{background:white;padding:25px;border-radius:15px}.treatment{background:#f8f0f8;padding:15px;border-radius:10px;margin:15px 0;border-left:4px solid #8e44ad}h3{color:#8e44ad}ul{margin-left:20px}a{color:white}.highlight-search{background-color:#fff3cd;padding:0 2px;border-radius:2px}</style><script>
(function(){const params=new URLSearchParams(window.location.search);const highlight=params.get('highlight');if(highlight){const body=document.body;const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);let node;const regex=new RegExp('('+highlight.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');const nodesToReplace=[];while(node=walker.nextNode()){if(node.parentElement.tagName==='MARK')continue;if(node.parentElement.tagName==='A')continue;if(node.parentElement.tagName==='SCRIPT')continue;const text=node.textContent;if(regex.test(text)){nodesToReplace.push({node:node,text:text});}}
nodesToReplace.forEach(item=>{const text=item.text;const parent=item.node.parentNode;const wrapper=document.createElement('span');wrapper.innerHTML=text.replace(regex,'<mark class="highlight-search">$1</mark>');while(wrapper.firstChild){parent.insertBefore(wrapper.firstChild,item.node);}parent.removeChild(item.node);});}})();</script></head><body><div class="container"><div class="header"><a href="index.html" style="color:white;">← Retour</a><h1>CONTRACEPTION</h1><p>Méthodes Contraceptives</p></div><div class="content"><div class="treatment"><h3>1. Post Partum</h3><ul><li><strong>Microprogestatif</strong> : Microval, hyan - 3 à 6 mois</li><li><strong>Mercilon</strong> : boite de 21</li></ul></div><div class="treatment"><h3>2. ADEPAL</h3><ul><li>Boite de 3 plaquettes</li><li>7cp blanc et 14cp orangés</li></ul></div></div></div></body></html>
