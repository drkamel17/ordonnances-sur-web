<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APHTOSE - CAT Consultation</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; padding: 25px; border-radius: 15px; margin-bottom: 25px; }
        .content { background: white; padding: 25px; border-radius: 15px; }
        h2 { color: #8e44ad; border-bottom: 2px solid #8e44ad; padding-bottom: 10px; }
        .treatment { background: #f8f0f8; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #8e44ad; }
        .highlight-search{background-color:#fff3cd;padding:0 2px;border-radius:2px}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" style="color:white;text-decoration:none;">← Retour</a>
            <h1>APHTOSE BUCCALE</h1>
        </div>
        <div class="content">
            <div class="treatment">
                <h3>1. PROPOSPRAY</h3>
                <ul>
                    <li>Gorge irritée, mauvaise haleine, aphtose buccale</li>
                    <li>Agiter avant emploi</li>
                    <li>2 bouffées x3/j pendant 2 à 3 semaines</li>
                </ul>
            </div>
            <div class="treatment">
                <h3>2. SOLUPRED ou SOLUGE</h3>
                <ul>
                    <li>Une dose poids /jour le matin</li>
                    <li>Pendant une semaine</li>
                </ul>
            </div>
        </div>
    </div>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const highlight = params.get('highlight');
    if (highlight) {
        const body = document.body;
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
        let node;
        const regex = new RegExp('(' + highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const nodesToReplace = [];
        while (node = walker.nextNode()) {
            if (node.parentElement.tagName === 'MARK') continue;
            if (node.parentElement.tagName === 'A') continue;
            if (node.parentElement.tagName === 'SCRIPT') continue;
            const text = node.textContent;
            if (regex.test(text)) {
                nodesToReplace.push({node: node, text: text});
            }
        }
        nodesToReplace.forEach(item => {
            const text = item.text;
            const parent = item.node.parentNode;
            const wrapper = document.createElement('span');
            wrapper.innerHTML = text.replace(regex, '<mark class="highlight-search">$1</mark>');
            while (wrapper.firstChild) {
                parent.insertBefore(wrapper.firstChild, item.node);
            }
            parent.removeChild(item.node);
        });
    }
})();
</script>
</body>
</html>
